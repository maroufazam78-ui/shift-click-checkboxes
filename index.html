<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shift Click Checkboxes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="inbox">
    
    <div class="item">
      <input type="checkbox">
      <p>This is an inbox layout.</p>
    </div>


    <div class="item">
      <input type="checkbox">
      <p>Check one item.</p>
    </div>


    <div class="item">
      <input type="checkbox">
      <p>Hold Down your Shift Key.</p>
    </div>

    <div class="item">
      <input type="checkbox">
      <p>Check a lower item.</p>
    </div>

    <div class="item">
      <input type="checkbox">
      <p>Everything inbetween should also be set to checked.</p>
    </div>


    <div class="item">
      <input type="checkbox">
      <p>Try do it with out any libraries.</p>
    </div>


    <div class="item">
      <input type="checkbox">
      <p>Just Regular JavaScript</p>
    </div>

    <div class="item">
      <input type="checkbox">
      <p>Good Luck!</p>
    </div>


    <div class="item">
      <input type="checkbox">
      <p>Don't Forget to tweet your result!</p>
    </div>

  </div>

  
  <script src="script.js"></script>
</body>
</html>
